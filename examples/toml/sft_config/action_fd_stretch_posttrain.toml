# ============================================================================
# Stretch LeRobot forward-dynamics post-training.
#
# Env required:
#   DATASET_PATH=/path/to/Stretch-LeRobot   (see cosmos_framework/scripts/convert_stretch_to_lerobot.py)
#   BASE_CHECKPOINT_PATH=<base DCP dir or object-store path>
#   WAN_VAE_PATH=<Wan2.2_VAE.pth>
#   IMAGINAIRE_OUTPUT_ROOT=/path/to/output_root
#
# The registered experiment owns dataset mode/action-space wiring:
#   mode="forward_dynamics", 10D ee_pose action, chunk_length=16, res480.
# ============================================================================

[job]
task       = "vfm"
experiment = "action_fd_stretch_posttrain"
project    = "cosmos3_action_fd"
group      = "action_sft"
name       = "action_fd_stretch_posttrain"
wandb_mode = "online"

[model]
precision = "bfloat16"

[model.parallelism]
data_parallel_shard_degree     = 8
data_parallel_replicate_degree = 1

[model.activation_checkpointing]
mode = "selective"

[model.tokenizer]
vae_path = "${oc.env:WAN_VAE_PATH}"

[dataloader_train]
# "quantile" rescales each of the 10 ee_pose action dims to ~[-1, 1] using the
# bundled q01/q99 stats (cosmos_framework/scripts/compute_stretch_action_stats.py).
action_normalization = "quantile"

[scheduler]
cycle_lengths = [20000]

[trainer]
max_iter     = 20000
logging_iter = 50

[checkpoint]
load_path = "${oc.env:BASE_CHECKPOINT_PATH}"
save_iter = 250
